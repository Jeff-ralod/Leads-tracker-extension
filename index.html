<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jeff's leads tracker</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>
        <i class="fa-solid fa-link"></i>
        Jeff's <span>leads tracker</span>
    </h1>

    <p class="subtitle">SAVE • ORGANIZE • COME BACK LATER </p>

    <input type="text" id="input-el" placeholder="Paste a link here ....">


    <!--Buttons-->
    <div class="buttons">

        <!--save button-->
        <button id="btn">
            <i class="fa-solid fa-floppy-disk"></i>
            SAVE
        </button>

        <!-- this is save tab-->
        <button id="tab-btn">
            <i class="fa-solid fa-window-maximize"></i>
            SAVE TAB
        </button>

        <!--delete button-->
        <button id="delete-btn">
            <i class="fa-solid fa-trash"></i>
            DELETE ALL
        </button>
    </div>

    <h2>Saved leads</h2>

    <ul id="list"></ul>

</body>
<script src="script.js"></script>
</html>
