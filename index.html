<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jeff's leads tracker</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link rel="stylesheet" href="style.css">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="manifest" href="/site.webmanifest">
</head>
<body>
    <h1>
        <i class="fa-solid fa-link"></i>
        Jeff's <span>leads tracker</span>
    </h1>

    <p class="subtitle">SAVE • ORGANIZE • COME BACK LATER </p>

    <input type="text" id="input-el" placeholder="Paste a link here ....">


    <!--Buttons-->
    <div class="buttons">

        <!--save button-->
        <button id="btn">
            <i class="fa-solid fa-floppy-disk"></i>
            SAVE
        </button>

        <!--delete button-->
        <button id="delete-btn">
            <i class="fa-solid fa-trash"></i>
            DELETE ALL
        </button>
    </div>

    <h2>Saved leads</h2>

    <ul id="list"></ul>

    <!-- FOOTER -->
<footer class="app-footer">

    <div class="footer-line"></div>

    <div class="footer-brand">
        <i class="fa-solid fa-link"></i>

        <div>
            <h3>JEFF'S LEADS</h3>
            <p>Save • Track • Return</p>
        </div>
    </div>

    <div class="connection-status">
        <span class="status-dot"></span>
        <span>Connected to firebase</span>
    </div>

</footer>

</body>
<script src="script.bundle.js"></script>
</html>
